<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная лекция: Жизнь Катона Старшего</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-roman { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-red-950 via-stone-900 to-amber-950 text-amber-50 min-h-screen flex flex-col">

    <!-- Верхняя панель (автоматически удаляется в режиме ?mode=voter) -->
    <header id="app-header" class="bg-red-900/80 border-b border-amber-600/40 p-4 shadow-2xl backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 p-2 rounded-xl text-red-950 font-bold shadow-lg">
                    🏛️
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide text-amber-300 font-roman">Катон Старший: Квест-Лекция</h1>
                    <p class="text-xs text-amber-200/70">Интерактивный исторический симулятор</p>
                </div>
            </div>
            
            <!-- Переключатели режимов -->
            <div class="flex items-center space-x-2 bg-red-950/80 p-1.5 rounded-xl border border-amber-600/30">
                <button onclick="switchMode('presenter')" id="btn-mode-presenter" class="px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-amber-500 text-red-950 shadow-md">
                    📊 Презентация
                </button>
                <button onclick="switchMode('editor')" id="btn-mode-editor" class="px-4 py-2 text-sm font-semibold rounded-lg transition-all text-amber-200/70 hover:text-amber-100">
                    ✏️ Редактор
                </button>
                <button onclick="switchMode('voter')" id="btn-mode-voter" class="px-4 py-2 text-sm font-semibold rounded-lg transition-all text-amber-200/70 hover:text-amber-100">
                    📱 Пульт зрителя
                </button>
            </div>

            <!-- Кнопки управления -->
            <div class="flex items-center space-x-2">
                <button onclick="openQrModal()" class="bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-200 transition-all">
                    📲 QR-код для зала
                </button>
                <button onclick="exportJson()" class="bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-200 transition-all" title="Сохранить JSON">
                    💾 Сохранить
                </button>
                <label class="bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/50 px-3 py-2 rounded-xl text-xs font-semibold text-amber-200 transition-all cursor-pointer">
                    📂 Загрузить
                    <input type="file" accept=".json" class="hidden" onchange="importJson(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Основной блок -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">
        
        <!-- РЕЖИМ ПРЕЗЕНТАТОРА -->
        <section id="view-presenter" class="space-y-6">
            <div class="bg-red-900/40 border-2 border-amber-500/30 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-lg relative overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <span id="pres-slide-badge" class="px-4 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full text-xs font-bold uppercase tracking-wider font-roman">
                        Слайд 1 из 2
                    </span>
                    <div id="pres-timer-box" class="hidden items-center gap-2 bg-amber-500/20 text-amber-300 border border-amber-500/40 px-4 py-1.5 rounded-full text-xs font-bold">
                        ⏱️ Голосование: <span id="pres-timer-val">15</span>с
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    <div class="space-y-4">
                        <h2 id="pres-title" class="text-2xl md:text-4xl font-bold text-amber-300 font-roman"></h2>
                        <p id="pres-content" class="text-amber-100/90 text-base md:text-lg leading-relaxed"></p>
                        <div id="pres-options-container" class="space-y-3 pt-4"></div>
                    </div>
                    
                    <div class="flex justify-center">
                        <img id="pres-image" src="" alt="Иллюстрация" class="max-h-80 w-full object-cover rounded-2xl shadow-2xl border-2 border-amber-500/40 hidden">
                    </div>
                </div>

                <!-- Блок Fast-Fail развилки -->
                <div id="pres-fastfail-box" class="mt-6 p-6 bg-red-950/80 border-2 border-amber-500/60 rounded-2xl hidden">
                    <div class="flex items-center gap-2 text-amber-400 font-bold text-lg mb-3 font-roman">
                        ⚠️ Исторический тупик (Fast-Fail)
                    </div>
                    <p id="pres-fastfail-text" class="text-amber-100 text-base mb-4"></p>
                    <img id="pres-fastfail-image" src="" alt="Концовка" class="max-h-64 rounded-xl object-cover border border-amber-500/40 hidden mb-4">
                    <button onclick="resetLecture()" class="bg-amber-500 hover:bg-amber-400 text-red-950 px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg text-sm">
                        🔄 Начать сначала
                    </button>
                </div>
            </div>

            <!-- Управление слайдами -->
            <div class="flex flex-wrap justify-between items-center bg-red-950/60 border border-amber-500/30 p-4 rounded-2xl gap-4 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <button onclick="prevSlide()" class="bg-red-900/60 hover:bg-red-800/80 text-amber-200 border border-amber-500/30 px-5 py-2.5 rounded-xl font-semibold transition-all">
                        ← Назад
                    </button>
                    <button onclick="nextSlide()" class="bg-amber-500 hover:bg-amber-400 text-red-950 font-bold px-6 py-2.5 rounded-xl transition-all shadow-lg">
                        Вперед →
                    </button>
                </div>

                <div id="voting-controls" class="flex items-center gap-4">
                    <button onclick="startTimer()" id="btn-start-timer" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-5 py-2.5 rounded-xl transition-all shadow-lg text-sm">
                        ▶️ Запустить таймер (15с)
                    </button>
                </div>
            </div>
        </section>

        <!-- РЕЖИМ РЕДАКТОРА -->
        <section id="view-editor" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-amber-300 font-roman">Редактор сценария</h2>
                <button onclick="addNewSlide()" class="bg-amber-500 hover:bg-amber-400 text-red-950 font-bold px-4 py-2 rounded-xl text-sm transition-all">
                    + Добавить слайд
                </button>
            </div>
            <div id="editor-slides-list" class="space-y-6"></div>
        </section>

        <!-- РЕЖИМ ЗРИТЕЛЯ -->
        <section id="view-voter" class="space-y-6 max-w-md mx-auto py-4 hidden">
            <div class="bg-red-900/50 border-2 border-amber-500/40 rounded-3xl p-6 shadow-2xl text-center space-y-6 backdrop-blur-lg">
                <div class="inline-flex p-4 bg-amber-500/20 text-amber-300 rounded-2xl border border-amber-500/40 text-2xl">
                    🏛️
                </div>
                <div>
                    <h2 id="voter-title" class="text-xl font-bold text-amber-300 font-roman mb-2"></h2>
                    <p id="voter-content" class="text-amber-100/90 text-sm leading-relaxed"></p>
                </div>
                <div id="voter-buttons-container" class="space-y-3 pt-2"></div>
            </div>
        </section>
    </main>

    <!-- Модальное окно QR-кода -->
    <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-red-950 border-2 border-amber-500/40 rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 text-center">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-amber-300 font-roman">QR-код для зрителей</h3>
                <button onclick="closeQrModal()" class="text-amber-200/60 hover:text-amber-100 text-xl font-bold">✕</button>
            </div>
            <p class="text-xs text-amber-200/70">Ссылка на пульт с добавленным <code class="text-amber-400 font-mono">?mode=voter</code>:</p>
            <input type="text" id="qr-url-input" class="w-full bg-red-900/50 border border-amber-500/40 rounded-xl px-3 py-2 text-xs text-amber-100 focus:outline-none focus:border-amber-400" oninput="updateQrCode()">
            <div class="bg-white p-4 rounded-2xl inline-block shadow-2xl">
                <div id="qrcode-render" class="w-44 h-44 flex items-center justify-center"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let lectureData = {
            title: "Жизнь Катона Старшего",
            slides: [
                {
                    id: 1,
                    title: "Начало пути: Юность в Тускуле",
                    content: "Марк Порций Катон родился в 234 г. до н.э. в плебейской семье. С каких шагов он решил начать свою публичную карьеру в древнем Риме?",
                    image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=80",
                    isVote: true,
                    options: [
                        { text: "Отправиться в армию и сразиться с Ганнибалом", nextSlide: 2, fastFail: false },
                        { text: "Открыть школу эллинской философии", nextSlide: null, fastFail: true, failText: "Катон открыто презирал изнеженность греческой философии! Римский сенат высмеял этот шаг, и его политическая карьера закончилась, так и не начавшись.", failImage: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80" }
                    ]
                },
                {
                    id: 2,
                    title: "Закалка в легионах",
                    content: "Катон героически проявил себя в битве при Метавре. Его суровость и строгие ценности заслужили уважение солдат и сенаторов.",
                    image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80",
                    isVote: false,
                    options: []
                }
            ]
        };

        let currentSlideIndex = 0;
        let timerInterval = null;
        let currentFastFail = null;

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            if (mode === 'voter') {
                const header = document.getElementById('app-header');
                if (header) header.remove();
                switchMode('voter');
            } else {
                const saved = localStorage.getItem('cato_lecture_data');
                if (saved) {
                    try { lectureData = JSON.parse(saved); } catch(e) {}
                }
                switchMode('presenter');
            }

            const qrInput = document.getElementById('qr-url-input');
            if (qrInput && !qrInput.value) {
                qrInput.value = window.location.href.split('?')[0] + '?mode=voter';
            }
        }

        function switchMode(mode) {
            document.getElementById('view-presenter').classList.add('hidden');
            document.getElementById('view-editor').classList.add('hidden');
            document.getElementById('view-voter').classList.add('hidden');

            ['presenter', 'editor', 'voter'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (btn) {
                    btn.className = m === mode 
                        ? "px-4 py-2 text-sm font-semibold rounded-lg transition-all bg-amber-500 text-red-950 shadow-md"
                        : "px-4 py-2 text-sm font-semibold rounded-lg transition-all text-amber-200/70 hover:text-amber-100";
                }
            });

            if (mode === 'presenter') {
                document.getElementById('view-presenter').classList.remove('hidden');
                renderPresenterSlide();
            } else if (mode === 'editor') {
                document.getElementById('view-editor').classList.remove('hidden');
                renderEditor();
            } else if (mode === 'voter') {
                document.getElementById('view-voter').classList.remove('hidden');
                renderVoterView();
            }
        }

        function renderPresenterSlide() {
            const slide = lectureData.slides[currentSlideIndex];
            if (!slide) return;

            document.getElementById('pres-slide-badge').innerText = `Слайд ${currentSlideIndex + 1} из ${lectureData.slides.length}`;
            document.getElementById('pres-title').innerText = slide.title;
            document.getElementById('pres-content').innerText = slide.content;

            const imgEl = document.getElementById('pres-image');
            if (slide.image) {
                imgEl.src = slide.image;
                imgEl.classList.remove('hidden');
            } else {
                imgEl.classList.add('hidden');
            }

            const optContainer = document.getElementById('pres-options-container');
            const votingControls = document.getElementById('voting-controls');
            const fastFailBox = document.getElementById('pres-fastfail-box');

            if (currentFastFail) {
                optContainer.innerHTML = '';
                votingControls.classList.add('hidden');
                fastFailBox.classList.remove('hidden');
                document.getElementById('pres-fastfail-text').innerText = currentFastFail.text;
                
                const ffImg = document.getElementById('pres-fastfail-image');
                if (currentFastFail.image) {
                    ffImg.src = currentFastFail.image;
                    ffImg.classList.remove('hidden');
                } else {
                    ffImg.classList.add('hidden');
                }
            } else {
                fastFailBox.classList.add('hidden');
                if (slide.isVote) {
                    votingControls.classList.remove('hidden');
                    optContainer.innerHTML = slide.options.map((opt, idx) => `
                        <div class="bg-red-950/60 border border-amber-500/40 p-3.5 rounded-xl flex justify-between items-center">
                            <span class="text-sm text-amber-100"><strong class="text-amber-400 mr-2">[Вариант ${idx+1}]</strong> ${opt.text}</span>
                        </div>
                    `).join('');
                } else {
                    votingControls.classList.add('hidden');
                    optContainer.innerHTML = '';
                }
            }
        }

        function nextSlide() {
            if (currentSlideIndex < lectureData.slides.length - 1) {
                currentSlideIndex++;
                currentFastFail = null;
                renderPresenterSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                currentFastFail = null;
                renderPresenterSlide();
            }
        }

        function resetLecture() {
            currentSlideIndex = 0;
            currentFastFail = null;
            renderPresenterSlide();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 15;
            const timerBox = document.getElementById('pres-timer-box');
            const timerVal = document.getElementById('pres-timer-val');
            timerBox.classList.remove('hidden');
            timerBox.classList.add('flex');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerVal.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerBox.classList.add('hidden');
                }
            }, 1000);
        }

        function renderVoterView() {
            const slide = lectureData.slides[currentSlideIndex];
            if (!slide) return;

            document.getElementById('voter-title').innerText = slide.title;
            document.getElementById('voter-content').innerText = slide.content;

            const btnContainer = document.getElementById('voter-buttons-container');
            if (slide.isVote) {
                btnContainer.innerHTML = slide.options.map((opt, idx) => `
                    <button onclick="castVote(${idx})" class="w-full bg-amber-500 hover:bg-amber-400 text-red-950 font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg text-sm">
                        Вариант ${idx + 1}: ${opt.text}
                    </button>
                `).join('');
            } else {
                btnContainer.innerHTML = `<div class="text-sm text-amber-200/60 py-4">Слушаем лектора...</div>`;
            }
        }

        function castVote(optionIndex) {
            const slide = lectureData.slides[currentSlideIndex];
            const opt = slide.options[optionIndex];
            if (opt && opt.fastFail) {
                currentFastFail = { text: opt.failText, image: opt.failImage };
            } else if (opt && opt.nextSlide) {
                const targetIdx = lectureData.slides.findIndex(s => s.id === opt.nextSlide);
                if (targetIdx !== -1) currentSlideIndex = targetIdx;
            }
            alert('Голос принят!');
        }

        function renderEditor() {
            const container = document.getElementById('editor-slides-list');
            container.innerHTML = lectureData.slides.map((slide, sIdx) => `
                <div class="bg-red-950/60 border border-amber-500/30 rounded-2xl p-5 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-amber-400 uppercase tracking-wider font-roman">Слайд #${slide.id}</span>
                        <button onclick="deleteSlide(${sIdx})" class="text-red-400 hover:text-red-300 text-sm font-bold">Удалить</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-amber-200/70 mb-1">Заголовок слайда</label>
                            <input type="text" value="${slide.title}" onchange="updateSlideField(${sIdx}, 'title', this.value)" class="w-full bg-red-900/40 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-amber-100">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-amber-200/70 mb-1">URL картинки</label>
                            <input type="text" value="${slide.image || ''}" onchange="updateSlideField(${sIdx}, 'image', this.value)" class="w-full bg-red-900/40 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-amber-100">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-amber-200/70 mb-1">Текст слайда</label>
                        <textarea rows="3" onchange="updateSlideField(${sIdx}, 'content', this.value)" class="w-full bg-red-900/40 border border-amber-500/30 rounded-xl px-3 py-2 text-sm text-amber-100">${slide.content}</textarea>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" ${slide.isVote ? 'checked' : ''} onchange="toggleSlideVote(${sIdx}, this.checked)" id="vote-${sIdx}">
                        <label for="vote-${sIdx}" class="text-sm text-amber-200 cursor-pointer">Включить голосование</label>
                    </div>

                    ${slide.isVote ? `
                        <div class="space-y-3 pt-2 border-t border-amber-500/20">
                            ${slide.options.map((opt, oIdx) => `
                                <div class="bg-red-900/30 p-3 rounded-xl border border-amber-500/20 space-y-2">
                                    <input type="text" value="${opt.text}" onchange="updateOptionText(${sIdx}, ${oIdx}, this.value)" class="w-full bg-red-950 border border-amber-500/30 rounded-lg px-3 py-1.5 text-sm text-amber-100" placeholder="Вариант ответа">
                                    <label class="flex items-center gap-2 text-xs text-amber-400">
                                        <input type="checkbox" ${opt.fastFail ? 'checked' : ''} onchange="toggleFastFail(${sIdx}, ${oIdx}, this.checked)"> Fast-Fail развилка
                                    </label>
                                    ${opt.fastFail ? `
                                        <input type="text" value="${opt.failText || ''}" onchange="updateFailText(${sIdx}, ${oIdx}, this.value)" class="w-full bg-red-950 border border-amber-500/30 rounded-lg px-3 py-1 text-xs text-amber-100" placeholder="Текст тупиковой концовки">
                                        <input type="text" value="${opt.failImage || ''}" onchange="updateFailImage(${sIdx}, ${oIdx}, this.value)" class="w-full bg-red-950 border border-amber-500/30 rounded-lg px-3 py-1 text-xs text-amber-100" placeholder="URL картинки концовки">
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateSlideField(idx, field, val) { lectureData.slides[idx][field] = val; saveToLocal(); }
        function toggleSlideVote(idx, val) {
            lectureData.slides[idx].isVote = val;
            if (val && !lectureData.slides[idx].options.length) {
                lectureData.slides[idx].options = [
                    { text: "Вариант 1", nextSlide: null, fastFail: false },
                    { text: "Вариант 2", nextSlide: null, fastFail: false }
                ];
            }
            saveToLocal(); renderEditor();
        }
        function updateOptionText(sIdx, oIdx, val) { lectureData.slides[sIdx].options[oIdx].text = val; saveToLocal(); }
        function toggleFastFail(sIdx, oIdx, val) { lectureData.slides[sIdx].options[oIdx].fastFail = val; saveToLocal(); renderEditor(); }
        function updateFailText(sIdx, oIdx, val) { lectureData.slides[sIdx].options[oIdx].failText = val; saveToLocal(); }
        function updateFailImage(sIdx, oIdx, val) { lectureData.slides[sIdx].options[oIdx].failImage = val; saveToLocal(); }
        
        function addNewSlide() {
            const newId = lectureData.slides.length ? Math.max(...lectureData.slides.map(s => s.id)) + 1 : 1;
            lectureData.slides.push({ id: newId, title: "Новый слайд", content: "Описание...", image: "", isVote: false, options: [] });
            saveToLocal(); renderEditor();
        }
        function deleteSlide(idx) {
            if (lectureData.slides.length <= 1) return alert('Нужен минимум 1 слайд');
            lectureData.slides.splice(idx, 1); saveToLocal(); renderEditor();
        }
        function saveToLocal() { localStorage.setItem('cato_lecture_data', JSON.stringify(lectureData)); }

        function exportJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lectureData, null, 2));
            const a = document.createElement('a'); a.href = dataStr; a.download = "cato_lecture.json"; document.body.appendChild(a); a.click(); a.remove();
        }
        function importJson(e) {
            const reader = new FileReader();
            if (e.target.files[0]) {
                reader.readAsText(e.target.files[0], "UTF-8");
                reader.onload = (evt) => {
                    try { lectureData = JSON.parse(evt.target.result); saveToLocal(); renderEditor(); alert('Загружено!'); } catch (err) { alert('Ошибка JSON'); }
                };
            }
        }

        function openQrModal() { document.getElementById('qr-modal').classList.remove('hidden'); updateQrCode(); }
        function closeQrModal() { document.getElementById('qr-modal').classList.add('hidden'); }
        function updateQrCode() {
            const url = document.getElementById('qr-url-input').value;
            const container = document.getElementById('qrcode-render');
            container.innerHTML = '';
            if (typeof QRCode !== 'undefined' && url) {
                new QRCode(container, { text: url, width: 175, height: 175, colorDark: "#450a0a", colorLight: "#ffffff" });
            }
        }

        // Прямой выпуск запуска без внешних задержек
        window.onload = initApp;
    </script>
</body>
</html>
