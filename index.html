<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная лекция: Марк Порций Катон</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700;900&family=Marcellus&display=swap" rel="stylesheet">
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- FIREBASE SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        roman: {
                            red: '#7A1C1C',
                            darkRed: '#4A0E0E',
                            gold: '#D4AF37',
                            lightGold: '#F3E5AB',
                            parchment: '#F4EBE1',
                            stone: '#2B2825'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        marcellus: ['Marcellus', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Marcellus', serif;
            background-color: #1A1715;
            color: #F4EBE1;
        }
        .roman-card {
            background: linear-gradient(135deg, rgba(43,40,37,0.95) 0%, rgba(26,23,21,0.98) 100%);
            border: 2px solid #7A1C1C;
        }
        .gold-text {
            background: linear-gradient(180deg, #FFF099 0%, #D4AF37 50%, #997A15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .roman-frame {
            border: 2px solid #D4AF37;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .timer-bar { transition: width 1s linear; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER (Вырезается автоматически при ?mode=voter) -->
    <header id="app-header" class="bg-roman-darkRed border-b-2 border-roman-gold p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-landmark text-roman-gold text-2xl"></i>
                <h1 class="font-cinzel text-xl font-bold gold-text uppercase">Марк Порций Катон</h1>
            </div>

            <div class="flex items-center gap-3">
                <div class="bg-roman-stone border border-roman-gold/50 rounded-lg p-1 flex text-xs">
                    <button id="btn-mode-presentation" onclick="switchMode('presentation')" class="px-3 py-1.5 rounded font-bold uppercase bg-roman-red text-white">Проектор</button>
                    <button id="btn-mode-editor" onclick="switchMode('editor')" class="px-3 py-1.5 rounded font-bold uppercase text-roman-lightGold">Редактор</button>
                    <button id="btn-mode-voter" onclick="switchMode('voter')" class="px-3 py-1.5 rounded font-bold uppercase text-roman-lightGold">Зритель</button>
                </div>
                <button onclick="toggleQRModal()" class="bg-roman-gold text-roman-darkRed font-bold px-3 py-1.5 rounded text-xs uppercase">
                    <i class="fa-solid fa-qrcode mr-1"></i> QR-код
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

        <!-- PRESENTATION VIEW -->
        <section id="presentation-view" class="space-y-6">
            <div class="roman-card rounded-xl p-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div id="step-badge" class="w-10 h-10 rounded-full border-2 border-roman-gold bg-roman-darkRed flex items-center justify-center font-cinzel font-bold text-roman-gold">I</div>
                    <div>
                        <span id="chapter-era" class="text-xs text-roman-gold uppercase block">Эпоха</span>
                        <h2 id="chapter-title" class="font-cinzel text-lg text-white font-bold">...</h2>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 roman-card rounded-xl p-6 border-t-4 border-t-roman-gold flex flex-col justify-between">
                    <div>
                        <div class="roman-frame mb-4 h-56 w-full rounded-lg overflow-hidden">
                            <img id="chapter-image" src="" class="w-full h-full object-cover">
                        </div>
                        <p id="story-text" class="text-lg text-roman-parchment leading-relaxed font-serif"></p>
                    </div>

                    <div id="question-box" class="bg-roman-darkRed/60 border-l-4 border-roman-gold p-4 rounded-r-lg mt-4">
                        <h3 class="font-cinzel text-roman-gold font-bold text-base"><i class="fa-solid fa-compass mr-2"></i> Решение зала:</h3>
                        <p id="question-text" class="text-sm text-gray-200 mt-1"></p>
                    </div>
                </div>

                <!-- CONTROLS -->
                <div class="roman-card rounded-xl p-6 flex flex-col justify-between border-t-4 border-t-roman-red">
                    <div id="timer-box" class="text-center mb-4">
                        <div class="text-xs uppercase text-roman-gold font-cinzel">Время на решение</div>
                        <div id="timer-display" class="font-cinzel text-4xl font-black text-white my-2">00:<span id="timer-sec">25</span></div>
                        <div class="w-full bg-roman-stone h-2 rounded-full overflow-hidden border border-roman-gold/30">
                            <div id="timer-bar" class="timer-bar h-full bg-roman-gold w-full"></div>
                        </div>
                    </div>

                    <div class="space-y-3 bg-roman-stone/90 p-4 rounded-lg border border-roman-gold/20">
                        <div class="text-xs font-bold text-roman-gold uppercase text-center border-b border-roman-gold/20 pb-2">Управление ведущего</div>
                        <div id="choice-controls" class="space-y-2">
                            <button onclick="startTimer()" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded text-xs">
                                <i class="fa-solid fa-play mr-1"></i> Запустить таймер
                            </button>
                            <button onclick="simulateVotes()" class="w-full bg-roman-darkRed border border-roman-gold/40 text-roman-lightGold font-bold py-2 px-3 rounded text-xs">
                                <i class="fa-solid fa-users-rays mr-1"></i> Симулировать голоса зала
                            </button>
                            <button onclick="evaluateResult()" class="w-full bg-roman-gold text-roman-darkRed font-cinzel font-bold py-2.5 px-3 rounded text-xs uppercase">
                                Подвести итог и далее →
                            </button>
                        </div>
                        <div id="info-controls" class="hidden">
                            <button onclick="nextSlide()" class="w-full bg-roman-gold text-roman-darkRed font-cinzel font-bold py-3 px-3 rounded text-sm uppercase">
                                Следующий слайд →
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CHOICES -->
            <div id="choices-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="roman-card rounded-xl p-6">
                    <div class="flex justify-between items-start mb-2">
                        <span class="w-8 h-8 rounded-full bg-roman-red text-roman-gold font-bold flex items-center justify-center">A</span>
                        <span id="pct-a" class="font-cinzel text-xl font-bold text-roman-gold">0%</span>
                    </div>
                    <h4 id="title-a" class="font-cinzel text-lg font-bold text-white mb-1"></h4>
                    <p id="desc-a" class="text-xs text-gray-300"></p>
                    <div class="w-full bg-roman-stone h-2 rounded-full overflow-hidden mt-3">
                        <div id="bar-a" class="h-full bg-roman-gold transition-all w-0"></div>
                    </div>
                </div>

                <div class="roman-card rounded-xl p-6">
                    <div class="flex justify-between items-start mb-2">
                        <span class="w-8 h-8 rounded-full bg-roman-stone border border-roman-gold text-roman-gold font-bold flex items-center justify-center">B</span>
                        <span id="pct-b" class="font-cinzel text-xl font-bold text-roman-gold">0%</span>
                    </div>
                    <h4 id="title-b" class="font-cinzel text-lg font-bold text-white mb-1"></h4>
                    <p id="desc-b" class="text-xs text-gray-300"></p>
                    <div class="w-full bg-roman-stone h-2 rounded-full overflow-hidden mt-3">
                        <div id="bar-b" class="h-full bg-roman-red transition-all w-0"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- GAME OVER / FAST-FAIL -->
        <section id="gameover-view" class="hidden max-w-3xl mx-auto text-center space-y-6">
            <div class="roman-card rounded-2xl p-8 border-4 border-roman-red">
                <div class="roman-frame mb-4 h-52 w-full rounded-xl overflow-hidden">
                    <img id="fail-img" src="" class="w-full h-full object-cover">
                </div>
                <h2 id="fail-title" class="font-cinzel text-2xl font-black text-roman-gold mb-2"></h2>
                <p id="fail-desc" class="text-base text-roman-parchment leading-relaxed mb-6 font-serif"></p>
                <button onclick="restartLecture()" class="bg-roman-gold text-roman-darkRed font-cinzel font-bold px-6 py-3 rounded-lg text-sm uppercase">
                    🔄 Начать с первого слайда
                </button>
            </div>
        </section>

        <!-- VOTER VIEW -->
        <section id="voter-view" class="hidden max-w-md mx-auto text-center space-y-6">
            <div class="roman-card rounded-3xl p-6 border-4 border-roman-gold space-y-4">
                <h2 id="voter-title" class="font-cinzel text-xl font-bold text-roman-gold">Пульт зрителя</h2>
                <p id="voter-question" class="text-sm text-gray-300"></p>
                <div id="voter-buttons" class="space-y-3"></div>
                <div id="voter-status-msg" class="text-xs text-emerald-400 font-bold hidden">✓ Ваш голос учтен!</div>
            </div>
        </section>

        <!-- EDITOR VIEW -->
        <section id="editor-view" class="hidden space-y-6">
            <div class="roman-card rounded-xl p-6 border-t-4 border-t-roman-gold">
                <h2 class="font-cinzel text-xl font-bold text-roman-gold mb-4">Редактор сценария</h2>
                <button onclick="exportJSON()" class="bg-roman-gold text-roman-darkRed font-bold px-4 py-2 rounded text-xs uppercase">Скачать JSON</button>
            </div>
        </section>

    </main>

    <!-- QR MODAL -->
    <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-roman-darkRed border-2 border-roman-gold rounded-3xl p-6 max-w-md w-full text-center space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-cinzel text-lg font-bold text-roman-gold">QR-код для зрителей</h3>
                <button onclick="toggleQRModal()" class="text-white text-xl">✕</button>
            </div>
            <input type="text" id="qr-url-input" class="w-full bg-roman-stone border border-roman-gold/40 rounded p-2 text-xs text-white" oninput="renderQR()">
            <div class="bg-white p-4 rounded-2xl inline-block">
                <div id="qrcode-target" class="w-44 h-44 flex items-center justify-center"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Firebase по вашей ссылке
        const firebaseConfig = {
            databaseURL: "https://cato-lecture-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const defaultData = [
            {
                id: 1,
                type: 'choice',
                era: '234 – 217 гг. до н.э.',
                title: 'Юность в Тускуле и выбор пути',
                image: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=1000&q=80',
                storyText: 'Марк Порций родился в Тускуле в плебейской семье. Он унаследовал скромное сабинское имение и с юных лет работал на земле. Но начавшаяся Вторая Пуническая война требует решения.',
                questionText: 'Какое направление выберет юный Катон?',
                timer: 25,
                optionA: { title: 'Военная служба против Ганнибала', desc: 'Отправиться в легионы и проявить себя суровой дисциплиной.' },
                optionB: { 
                    title: 'Изучение греческой философии', 
                    desc: 'Поехать в Афины и овладеть эллинистической культурой.',
                    failTitle: 'Провал: Пренебрежение Рима',
                    failDesc: 'Катон увлекся греческой изнеженностью! В традиционном Риме философия считалась опасной чуждой страстью. Сенаторы высмеяли молодой умишко, и карьера Катона закончилась.',
                    failImage: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=1000&q=80'
                }
            },
            {
                id: 2,
                type: 'info',
                era: '214 – 204 гг. до н.э.',
                title: 'Закалка в легионах',
                image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1000&q=80',
                storyText: 'Катон проявил исключительное мужество при осаде Тарента и в решающей битве при Метавре. Его суровость, отказ от роскоши и личная храбрость заслужили уважение солдат и сенаторов.',
                timer: 0
            }
        ];

        let slides = defaultData;
        let currentIdx = 0;
        let votesA = 0;
        let votesB = 0;
        let timerInt = null;
        let hasVoted = false;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'voter') {
                const header = document.getElementById('app-header');
                if (header) header.remove();
                switchMode('voter');
                
                // Слушаем смену слайдов в реальном времени от ведущего
                db.ref('currentSlide').on('value', (snapshot) => {
                    const newIdx = snapshot.val();
                    if (newIdx !== null && newIdx !== currentIdx) {
                        currentIdx = newIdx;
                        hasVoted = false;
                        renderVoter();
                    }
                });

            } else {
                switchMode('presentation');
                
                // Ведущий слушает поступающие голоса из облака в реальном времени
                db.ref('votes').on('value', (snapshot) => {
                    const data = snapshot.val() || { A: 0, B: 0 };
                    votesA = data.A || 0;
                    votesB = data.B || 0;
                    updateBars();
                });
            }

            const qrInput = document.getElementById('qr-url-input');
            if (qrInput) qrInput.value = window.location.href.split('?')[0] + '?mode=voter';
        };

        function switchMode(mode) {
            ['presentation', 'editor', 'gameover', 'voter'].forEach(m => {
                const el = document.getElementById(`${m}-view`);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(`${mode}-view`).classList.remove('hidden');

            if (mode === 'presentation') renderPresentation();
            if (mode === 'voter') renderVoter();
        }

        function renderPresentation() {
            const slide = slides[currentIdx];
            if (!slide) return;

            // Передаем номер текущего слайда в облако
            db.ref('currentSlide').set(currentIdx);
            db.ref('votes').set({ A: 0, B: 0 }); // Сбрасываем голоса при смене слайда

            document.getElementById('step-badge').innerText = currentIdx + 1;
            document.getElementById('chapter-era').innerText = slide.era || '';
            document.getElementById('chapter-title').innerText = slide.title;
            document.getElementById('story-text').innerText = slide.storyText;
            document.getElementById('chapter-image').src = slide.image;

            const isChoice = (slide.type === 'choice');
            document.getElementById('choices-container').style.display = isChoice ? 'grid' : 'none';
            document.getElementById('question-box').style.display = isChoice ? 'block' : 'none';
            document.getElementById('timer-box').style.display = isChoice ? 'block' : 'none';
            document.getElementById('choice-controls').style.display = isChoice ? 'block' : 'none';
            document.getElementById('info-controls').style.display = isChoice ? 'none' : 'block';

            if (isChoice) {
                document.getElementById('question-text').innerText = slide.questionText;
                document.getElementById('title-a').innerText = slide.optionA.title;
                document.getElementById('desc-a').innerText = slide.optionA.desc;
                document.getElementById('title-b').innerText = slide.optionB.title;
                document.getElementById('desc-b').innerText = slide.optionB.desc;
            }
        }

        function renderVoter() {
            const slide = slides[currentIdx];
            if (!slide) return;

            document.getElementById('voter-title').innerText = slide.title;
            const btnBox = document.getElementById('voter-buttons');
            const statusMsg = document.getElementById('voter-status-msg');

            if (slide.type === 'choice') {
                document.getElementById('voter-question').innerText = slide.questionText;
                if (hasVoted) {
                    btnBox.innerHTML = '';
                    statusMsg.classList.remove('hidden');
                } else {
                    statusMsg.classList.add('hidden');
                    btnBox.innerHTML = `
                        <button onclick="voterClick('A')" class="w-full bg-roman-red border border-roman-gold text-white font-bold py-4 px-4 rounded-xl text-sm active:scale-95 transition">
                            Вариант A: ${slide.optionA.title}
                        </button>
                        <button onclick="voterClick('B')" class="w-full bg-roman-stone border border-roman-gold text-roman-lightGold font-bold py-4 px-4 rounded-xl text-sm active:scale-95 transition">
                            Вариант B: ${slide.optionB.title}
                        </button>
                    `;
                }
            } else {
                document.getElementById('voter-question').innerText = 'Слушаем повествование лектора...';
                btnBox.innerHTML = '<div class="text-xs text-gray-400 py-4">Ожидание следующего решения</div>';
                statusMsg.classList.add('hidden');
            }
        }

        function voterClick(type) {
            if (hasVoted) return;
            hasVoted = true;

            // Безопасно увеличиваем значение голоса в облаке Firebase
            db.ref('votes/' + type).transaction((current) => {
                return (current || 0) + 1;
            });

            renderVoter();
        }

        function simulateVotes() {
            const rA = Math.floor(Math.random() * 25) + 10;
            const rB = Math.floor(Math.random() * 10);
            db.ref('votes').set({ A: rA, B: rB });
        }

        function updateBars() {
            const total = votesA + votesB || 1;
            const pctA = Math.round((votesA / total) * 100);
            const pctB = Math.round((votesB / total) * 100);
            document.getElementById('pct-a').innerText = `${pctA}%`;
            document.getElementById('pct-b').innerText = `${pctB}%`;
            document.getElementById('bar-a').style.width = `${pctA}%`;
            document.getElementById('bar-b').style.width = `${pctB}%`;
        }

        function startTimer() {
            clearInterval(timerInt);
            let sec = 25;
            timerInt = setInterval(() => {
                sec--;
                document.getElementById('timer-sec').innerText = sec;
                document.getElementById('timer-bar').style.width = `${(sec / 25) * 100}%`;
                if (sec <= 0) {
                    clearInterval(timerInt);
                    evaluateResult();
                }
            }, 1000);
        }

        function evaluateResult() {
            const slide = slides[currentIdx];
            if (votesB > votesA) {
                document.getElementById('fail-title').innerText = slide.optionB.failTitle;
                document.getElementById('fail-desc').innerText = slide.optionB.failDesc;
                document.getElementById('fail-img').src = slide.optionB.failImage;
                switchMode('gameover');
            } else {
                nextSlide();
            }
        }

        function nextSlide() {
            if (currentIdx < slides.length - 1) {
                currentIdx++;
                renderPresentation();
            }
        }

        function restartLecture() {
            currentIdx = 0;
            switchMode('presentation');
        }

        function toggleQRModal() {
            const modal = document.getElementById('qr-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) renderQR();
        }

        function renderQR() {
            const url = document.getElementById('qr-url-input').value;
            const target = document.getElementById('qrcode-target');
            target.innerHTML = '';
            if (url && typeof QRCode !== 'undefined') {
                new QRCode(target, { text: url, width: 175, height: 175, colorDark: "#4A0E0E", colorLight: "#ffffff" });
            }
        }

        function exportJSON() {
            const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(slides, null, 2));
            const a = document.createElement('a'); a.href = str; a.download = "cato_quest.json";
            document.body.appendChild(a); a.click(); a.remove();
        }
    </script>
</body>
</html>
